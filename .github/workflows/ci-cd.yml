name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Frontend Job
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend

  # .NET Services Job
  dotnet-services:
    name: .NET Services Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - UserService
          - ShopService
          - AccountingService
          - MasterdataService

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/services/dotnet/${{ matrix.service }}/${{ matrix.service }}.csproj

      - name: Build
        run: dotnet build apps/services/dotnet/${{ matrix.service }}/${{ matrix.service }}.csproj --no-restore -c Release

      - name: Run tests
        if: matrix.service != 'UserService'
        run: |
          TEST_PROJECT="apps/services/dotnet/${{ matrix.service }}.Tests/${{ matrix.service }}.Tests.csproj"
          if [ -f "$TEST_PROJECT" ]; then
            dotnet test "$TEST_PROJECT" -c Release --collect:"XPlat Code Coverage"
          fi

  # Java Services Job
  java-services:
    name: Java Services Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - company-service
          - notification-service
          - translation-service
          - scripting-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/services/java/${{ matrix.service }}/gradlew

      - name: Build and Test
        working-directory: apps/services/java/${{ matrix.service }}
        run: ./gradlew build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: apps/services/java/${{ matrix.service }}/build/reports/tests

  # Gateway Job
  gateway:
    name: Gateway Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/gateway

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate supergraph config
        run: |
          npm install -g @apollo/rover
          rover supergraph compose --config supergraph-config.yaml --elv2-license accept || true

  # E2E (Playwright) Job
  # Runs the complete Playwright suite (apps/e2e) against the real full stack
  # started via docker-compose.prod-local.yml (frontend on 8088, webshop on 3008,
  # gateway on 4000). The auth test always runs first and the suite stops
  # immediately if it fails.
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start ERP stack (docker compose)
        run: |
          docker compose -f docker-compose.prod-local.yml up -d --build
          # Wait for the gateway, frontend and webshop to become reachable
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/health >/dev/null 2>&1 && \
               curl -sf http://localhost:8088/ >/dev/null 2>&1 && \
               curl -sf http://localhost:3008/ >/dev/null 2>&1; then
              echo "Stack is up after ${i} tries"
              break
            fi
            sleep 10
          done
          curl -sf http://localhost:4000/health >/dev/null || { echo "Gateway never became healthy"; exit 1; }
          curl -sf http://localhost:8088/ >/dev/null || { echo "Frontend never became healthy"; exit 1; }
          curl -sf http://localhost:3008/ >/dev/null || { echo "Webshop never became healthy"; exit 1; }

      - name: Run Playwright E2E tests
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:8088
          E2E_WEBSHOP_URL: http://localhost:3008
        run: npx playwright test
        working-directory: apps/e2e

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: apps/e2e/test-results
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.prod-local.yml down -v

  # Docker Build Job
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, dotnet-services, java-services, gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: frontend
            context: ./apps/frontend
            dockerfile: ./apps/frontend/Dockerfile
          - service: gateway
            context: ./apps/gateway
            dockerfile: ./apps/gateway/Dockerfile
          - service: user-service
            context: ./apps/services/dotnet
            dockerfile: ./apps/services/dotnet/UserService/Dockerfile
          - service: shop-service
            context: ./apps/services/dotnet
            dockerfile: ./apps/services/dotnet/ShopService/Dockerfile
          - service: company-service
            context: ./apps/services/java/company-service
            dockerfile: ./apps/services/java/company-service/Dockerfile
          - service: notification-service
            context: ./apps/services/java/notification-service
            dockerfile: ./apps/services/java/notification-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push (attempt 1)
        id: build_push_1
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (attempt 2)
        id: build_push_2
        if: steps.build_push_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (attempt 3)
        id: build_push_3
        if: steps.build_push_1.outcome == 'failure' && steps.build_push_2.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build result
        if: always()
        run: |
          if [ "${{ steps.build_push_1.outcome }}" = "success" ] || \
             [ "${{ steps.build_push_2.outcome }}" = "success" ] || \
             [ "${{ steps.build_push_3.outcome }}" = "success" ]; then
            echo "Docker build and push succeeded."
          else
            echo "Docker build and push failed after 3 attempts."
            exit 1
          fi

  # Deploy to Development (K3s cluster)
  deploy-dev:
    name: Deploy to Development (K3s)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl for K3s
        run: |
          # KUBE_CONFIG_DEV must be the base64-encoded /etc/rancher/k3s/k3s.yaml
          # from the target K3s server (with server URL updated to the host's IP)
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=kubeconfig" >> $GITHUB_ENV

      - name: Deploy to K3s
        run: |
          helm upgrade --install erp-system ./infrastructure/helm/erp-system \
            --namespace erp \
            --create-namespace \
            --set global.environment=development \
            --set global.imageTag=${{ github.sha }}


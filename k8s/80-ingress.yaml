---
# =============================================================================
# Ingress — Traefik routing with cert-manager TLS
#
# Routes:
#   /         → erp-frontend:3000   (ERP main app, nginx proxies /graphql internally)
#   /shop     → erp-webshop:3008    (public webshop)
#   /graphql  → erp-gateway:4000    (direct WebSocket-compatible GraphQL)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp-ingress
  namespace: erp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - erp.shopping-now.net
      secretName: erp-tls-cert
  rules:
    - host: erp.shopping-now.net
      http:
        paths:
          # GraphQL API — direct route for WebSocket upgrade support
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: erp-gateway
                port:
                  number: 4000
          # API Routes (proxied directly to backend services)
          - path: /api/smtp-configuration
            pathType: Prefix
            backend:
              service:
                name: erp-notification-service
                port:
                  number: 8082
          - path: /api/templates
            pathType: Prefix
            backend:
              service:
                name: erp-templates-service
                port:
                  number: 8087
          - path: /api/masterdata
            pathType: Prefix
            backend:
              service:
                name: erp-masterdata-service
                port:
                  number: 5002
          - path: /api/shop
            pathType: Prefix
            backend:
              service:
                name: erp-shop-service
                port:
                  number: 5003
          - path: /api/company
            pathType: Prefix
            backend:
              service:
                name: erp-company-service
                port:
                  number: 8080
          - path: /api/translation
            pathType: Prefix
            backend:
              service:
                name: erp-translation-service
                port:
                  number: 8081
          # Templates Service direct access
          - path: /api/accounting
            pathType: Prefix
            backend:
              service:
                name: erp-accounting-service
                port:
                  number: 5001
          # MinIO document buckets
          - path: /documents-
            pathType: Prefix
            backend:
              service:
                name: erp-minio
                port:
                  number: 9000
          # Shop GraphQL API — frontend sends shop queries to /shop/graphql
          - path: /shop/graphql
            pathType: Prefix
            backend:
              service:
                name: erp-gateway
                port:
                  number: 4000
          # Webshop
          - path: /shop
            pathType: Prefix
            backend:
              service:
                name: erp-webshop
                port:
                  number: 3008
          # ERP Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erp-frontend
                port:
                  number: 3000

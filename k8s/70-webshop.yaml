---
# =============================================================================
# Webshop (React SPA served via nginx, port 3008)
# =============================================================================

# k8s-adapted nginx config — uses erp-gateway service name
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-webshop-nginx-config
  namespace: erp
data:
  default.conf: |
    server {
        listen 3008;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /graphql {
            proxy_pass http://erp-gateway:4000/graphql;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: erp-webshop
  namespace: erp
  labels:
    app: erp-webshop
spec:
  type: ClusterIP
  selector:
    app: erp-webshop
  ports:
    - port: 3008
      targetPort: 3008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-webshop
  namespace: erp
  labels:
    app: erp-webshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-webshop
  template:
    metadata:
      labels:
        app: erp-webshop
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: webshop
          image: ghcr.io/jctroth/erp-webshop:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3008
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          env:
            - name: VITE_API_URL
              value: "/graphql"
            - name: VITE_API_WS_URL
              value: "wss://erp.shopping-now.net/graphql"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: nginx-config
          configMap:
            name: erp-webshop-nginx-config

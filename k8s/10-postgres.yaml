---
# PostgreSQL StatefulSet — single instance shared by all ERP services
apiVersion: v1
kind: Service
metadata:
  name: erp-postgres
  namespace: erp
  labels:
    app: erp-postgres
spec:
  type: ClusterIP
  selector:
    app: erp-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-postgres-data
  namespace: erp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-postgres
  namespace: erp
  labels:
    app: erp-postgres
spec:
  replicas: 1
  serviceName: erp-postgres
  selector:
    matchLabels:
      app: erp-postgres
  template:
    metadata:
      labels:
        app: erp-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: erp-db-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db-secret
                  key: postgres-password
            - name: POSTGRES_DB
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db-secret
                  key: postgres-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: erp-postgres-data
        - name: init-scripts
          configMap:
            name: erp-postgres-init

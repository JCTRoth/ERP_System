# ── Notification Service (port 8082) ──────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: erp-notification-service
  namespace: erp
  labels:
    app: erp-notification-service
spec:
  type: ClusterIP
  selector:
    app: erp-notification-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-notification-service
  namespace: erp
  labels:
    app: erp-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-notification-service
  template:
    metadata:
      labels:
        app: erp-notification-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: notification-service
          image: ghcr.io/jctroth/erp-notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://erp-postgres:5432/notificationdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "erp_notification"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "Ra$hWee5Pei1e$"
            - name: SERVER_PORT
              value: "8082"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: erp-smtp-secret
                  key: smtp-host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: erp-smtp-secret
                  key: smtp-port
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: erp-smtp-secret
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-smtp-secret
                  key: smtp-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z erp-postgres 5432; do echo "Waiting for postgres..."; sleep 3; done']
